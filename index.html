<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR ตามพิกัด · 0214381 Lab 3</title>
  <!-- A-Frame 1.6.0 และ AR.js 3.4.8 (ชุดเดียวกับ Lab 1) -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/three.js/build/ar-threex-location-only.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
  <script>
    // ให้วัตถุหันหน้าเข้าหาผู้ใช้เสมอ (อ่านป้ายได้จากทุกทิศ)
    AFRAME.registerComponent('face-me', {
      tick: function () {
        const cam = this.el.sceneEl.camera;
        if (!cam) return;
        const me = new THREE.Vector3(), target = new THREE.Vector3();
        this.el.object3D.getWorldPosition(me); cam.getWorldPosition(target);
        target.y = me.y;                       // หมุนเฉพาะแนวนอน ป้ายไม่เอียงขึ้นลง
        this.el.object3D.lookAt(target);
      }
    });
  </script>
  <style>
    #hud {
      position: fixed; top: 10px; left: 10px; right: 10px; z-index: 1000;
      background: rgba(30, 16, 68, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff; border-radius: 14px;
      padding: 12px 14px; font: 14px/1.5 system-ui, -apple-system, sans-serif;
      box-shadow: 0 4px 20px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.18);
      max-height: 90vh; overflow-y: auto;
    }
    #hud b { color: #C9B8F0; }
    .hud-header {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap;
    }
    .hud-title {
      font-size: 13px; color: #D5CAFA; display: flex; align-items: center; gap: 6px;
    }
    .hud-coords {
      font-size: 15px; font-weight: 700; color: #7BFFB2; margin: 2px 0;
      word-break: break-all;
    }
    .hud-sub {
      font-size: 12px; color: #E0D7FA;
    }
    .btn-group {
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    }
    button {
      font-family: inherit;
    }
    .btn-gps {
      background: linear-gradient(135deg, #FF6B9D, #C83B7A);
      color: #fff; border: none; border-radius: 8px;
      padding: 7px 11px; font-size: 12px; font-weight: 600;
      cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      display: inline-flex; align-items: center; gap: 4px;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn-set {
      background: linear-gradient(135deg, #4E65FF, #92EFFD);
      color: #1A1145; border: none; border-radius: 8px;
      padding: 7px 11px; font-size: 12px; font-weight: 700;
      cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      display: inline-flex; align-items: center; gap: 4px;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn-gear, .btn-copy {
      background: rgba(255,255,255,0.18);
      color: #fff; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px;
      padding: 7px 9px; font-size: 12px; font-weight: 500;
      cursor: pointer; transition: background 0.2s;
    }
    button:active {
      transform: scale(0.96); opacity: 0.9;
    }
    .hud-distances {
      margin-top: 8px; padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.15);
      font-size: 13px; line-height: 1.4; color: #F0ECFC;
    }
    #tools-panel {
      display: none; margin-top: 10px; padding: 10px;
      background: rgba(0,0,0,0.35); border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12); font-size: 12px;
    }
    .panel-section-title {
      font-weight: 600; color: #C9B8F0; margin-bottom: 6px;
    }
    .panel-btns {
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .btn-sm {
      background: rgba(255,255,255,0.16); color: #fff;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
      padding: 5px 8px; font-size: 11px; cursor: pointer;
    }
    #toast {
      margin-top: 8px; padding: 6px 10px;
      background: rgba(20, 140, 70, 0.95);
      border-radius: 6px; font-size: 12px; color: #FFFFFF;
      text-align: center; display: none;
      animation: fadeIn 0.2s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">
  <div id="hud">
    <div class="hud-header">
      <div>
        <div class="hud-title">
          <span id="gps-status-dot" style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#FFCE54;"></span>
          <span id="gps-status-text">กำลังค้นหา GPS…</span>
        </div>
        <div class="hud-coords" id="hud-coords">รอรับพิกัด…</div>
        <div class="hud-sub" id="hud-sub">ความแม่นยำ: …</div>
      </div>
      <div class="btn-group">
        <button id="btn-check" class="btn-gps" type="button" onclick="checkGPS()">
          <span>📍</span> เช็คพิกัด
        </button>
        <button id="btn-set-around" class="btn-set" type="button" onclick="setPointsAroundMe()" title="สร้างเซ็ตพิกัดจุด A, B, C รอบตำแหน่งปัจจุบัน">
          <span>🎯</span> เซ็ตจุดรอบตัว
        </button>
        <button id="btn-toggle-tools" class="btn-gear" type="button" onclick="toggleToolsPanel()" title="ตั้งค่า/ปักหมุดจุด">
          ⚙️
        </button>
        <button id="btn-copy" class="btn-copy" type="button" onclick="copyCoords()" title="คัดลอกพิกัดปัจจุบัน">
          📋
        </button>
      </div>
    </div>

    <!-- แผงเครื่องมือตั้งค่าพิกัดเพิ่มเติม -->
    <div id="tools-panel">
      <div class="panel-section-title">📌 ปักหมุดเฉพาะจุด ณ ตำแหน่งที่ยืนอยู่:</div>
      <div class="panel-btns">
        <button class="btn-sm" type="button" onclick="pinSinglePoint('Abyme')">ปักหมุด จุด A</button>
        <button class="btn-sm" type="button" onclick="pinSinglePoint('จุด B')">ปักหมุด จุด B</button>
        <button class="btn-sm" type="button" onclick="pinSinglePoint('จุด C')">ปักหมุด จุด C</button>
      </div>
      <div class="panel-section-title">⚡ จัดการพิกัด:</div>
      <div class="panel-btns">
        <button class="btn-sm" type="button" onclick="copyConfigCode()">📄 คัดลอกโค้ดไปใส่ index.html</button>
        <button class="btn-sm" type="button" onclick="resetToDefaultPlaces()" style="color:#FFA8A8;">🔄 คืนค่าเริ่มต้น</button>
      </div>
    </div>

    <div id="toast"></div>
    <div class="hud-distances" id="hud-distances">กำลังคำนวณระยะห่าง…</div>
  </div>

  <a-scene vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
           renderer="antialias: true; alpha: true">

    <!-- กล้องที่รู้ตำแหน่ง GPS ของผู้ใช้ · gpsMinDistance: 0 เพื่อให้อัปเดตตำแหน่งแบบเรียลไทม์ตามมือถือ -->
    <a-camera gps-new-camera="gpsMinDistance: 0"></a-camera>

    <!-- หน่วยของขนาดในโหมดนี้คือ "เมตรจริง" วัตถุที่อยู่ห่าง 30 เมตรจึงต้องใหญ่หลายเมตรถึงจะเห็นชัด
         วางจุดตัวอย่างรอบพิกัดอ้างอิง 7.808323, 99.941298 -->

    <!-- ① แก้ได้: จุด A · ใส่ latitude และ longitude ของสถานที่จริงที่วัดมา และเปลี่ยน data-name -->
    <a-entity data-name="Abyme" gps-new-entity-place="latitude: 7.808323; longitude: 99.941298">
      <a-image src="./assets/xx.png" width="5" height="5" position="0 4 0"
               face-me material="transparent: true; side: double"></a-image>
      <a-text face-me value="POINT A" align="center" color="#FFFFFF" width="20" position="0 8 0"></a-text>
    </a-entity>

    <!-- ② แก้ได้: จุด B · ลองเปลี่ยนสี ขนาด หรือเปลี่ยน a-sphere เป็น a-cylinder -->
    <a-entity data-name="จุด B" gps-new-entity-place="latitude: 7.808447991102023; longitude: 99.94159692190079">
      <a-sphere color="#FF78AA" radius="2.5" position="0 2.5 0"></a-sphere>
      <a-text face-me value="POINT B" align="center" color="#FFFFFF" width="40" position="0 7 0"></a-text>
    </a-entity>

    <!-- ③ แก้ได้: จุด C · ป้ายข้อความล้วน (ใช้ภาษาอังกฤษ เพราะ a-text แสดงภาษาไทยไม่ได้) -->
    <a-entity data-name="จุด C" gps-new-entity-place="latitude: 7.808147991102023; longitude: 99.94129692190079">
      <a-entity face-me position="0 4 0">
        <a-plane color="#2A1B5C" width="14" height="5"></a-plane>
        <a-text value="WELCOME C" align="center" color="#FFCE54" width="40" position="0 0 0.1"></a-text>
      </a-entity>
    </a-entity>

    <!-- ④ ท้าทาย: คัดลอกบล็อก a-entity ทั้งก้อนมาวางเพิ่มเป็นจุด D ที่ตำแหน่งใหม่ -->

  </a-scene>

  <script>
    // โหมดจำลอง: เปิดลิงก์แล้วต่อท้ายด้วย ?sim จะ "ยืน" ห่างจุด A ไปทางใต้ประมาณ 33 เมตร (ใช้ในห้องหรือบนคอมพิวเตอร์)
    const mobileUA = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const ipadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
    const IS_MOBILE = mobileUA || ipadOS;
    const SIM = new URLSearchParams(location.search).has('sim') && !IS_MOBILE;

    const hudCoords = document.getElementById('hud-coords');
    const hudSub = document.getElementById('hud-sub');
    const hudDistances = document.getElementById('hud-distances');
    const statusDot = document.getElementById('gps-status-dot');
    const statusText = document.getElementById('gps-status-text');
    const toast = document.getElementById('toast');
    const btnCheck = document.getElementById('btn-check');
    const toolsPanel = document.getElementById('tools-panel');

    const scene = document.querySelector('a-scene');
    const cam = document.querySelector('[gps-new-camera]');
    const places = [...document.querySelectorAll('[gps-new-entity-place]')];

    // บันทึกพิกัดตั้งต้นจาก HTML
    const defaultPlaces = {};
    places.forEach(p => {
      const attr = p.getAttribute('gps-new-entity-place');
      defaultPlaces[p.dataset.name] = {
        lat: parseFloat(attr.latitude),
        lon: parseFloat(attr.longitude)
      };
    });

    let me = null, accuracy = null, lastUpdate = null;
    let toastTimeout = null;

    // คำนวณระยะทางตามเส้นรอบวงโลก (Haversine Formula) ในหน่วยเมตร
    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const toRad = deg => deg * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function showToast(msg, duration = 3000) {
      if (toastTimeout) clearTimeout(toastTimeout);
      toast.textContent = msg;
      toast.style.display = 'block';
      toastTimeout = setTimeout(() => {
        toast.style.display = 'none';
      }, duration);
    }

    function renderHUD() {
      if (!me) return;

      const timeStr = lastUpdate ? `(${lastUpdate.toLocaleTimeString('th-TH')})` : '';
      hudCoords.textContent = `${me.latitude.toFixed(6)}, ${me.longitude.toFixed(6)}`;

      if (SIM) {
        statusDot.style.background = '#38D9A9';
        statusText.textContent = 'โหมดจำลอง (SIM)';
        hudSub.innerHTML = `ความแม่นยำ: <b>โหมดจำลอง</b> ${timeStr}`;
      } else {
        statusDot.style.background = '#51CF66';
        statusText.textContent = 'GPS เรียลไทม์';
        const accText = accuracy ? `± ${Math.round(accuracy)} ม.` : '…';
        hudSub.innerHTML = `ความแม่นยำ: <b>${accText}</b> ${timeStr}`;
      }

      // คำนวณระยะห่างไปยังแต่ละจุด
      const rows = places.map(p => {
        const comp = p.components['gps-new-entity-place'];
        let d = comp ? comp.distance : undefined;

        // หาก AR.js ยังไม่คำนวณระยะ ให้ใช้ Haversine formula เพื่อแสดงผลทันที
        if (d === undefined || isNaN(d)) {
          const lat = parseFloat(p.getAttribute('gps-new-entity-place').latitude);
          const lon = parseFloat(p.getAttribute('gps-new-entity-place').longitude);
          if (!isNaN(lat) && !isNaN(lon)) {
            d = calcDistance(me.latitude, me.longitude, lat, lon);
          }
        }
        return `${p.dataset.name}: <b>${d === undefined ? '…' : Math.round(d) + ' ม.'}</b>`;
      }).join(' · ');

      hudDistances.innerHTML = rows || 'ไม่มีจุดมาร์กเกอร์';
    }

    // ฟังก์ชันอัปเดตตำแหน่งเมื่อได้รับพิกัดใหม่
    function updatePosition(coords) {
      me = {
        latitude: coords.latitude,
        longitude: coords.longitude
      };
      if (coords.accuracy !== undefined) accuracy = coords.accuracy;
      lastUpdate = new Date();
      renderHUD();
    }

    // ฟังก์ชันสำหรับปุ่ม "เช็คพิกัด"
    function checkGPS() {
      if (SIM) {
        showToast(`📍 พิกัดจำลอง: ${me ? me.latitude.toFixed(6) + ', ' + me.longitude.toFixed(6) : 'กำลังโหลด…'}`);
        return;
      }
      if (!navigator.geolocation) {
        alert('เบราว์เซอร์ของคุณไม่รองรับ Geolocation');
        return;
      }

      const originalBtnText = btnCheck.innerHTML;
      btnCheck.innerHTML = '<span>⏳</span> กำลังเช็ค…';
      btnCheck.disabled = true;

      navigator.geolocation.getCurrentPosition(
        pos => {
          btnCheck.innerHTML = originalBtnText;
          btnCheck.disabled = false;
          updatePosition(pos.coords);
          const coordText = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
          showToast(`📍 พิกัดล่าสุด: ${coordText} (±${Math.round(pos.coords.accuracy)} ม.)`, 4000);
        },
        err => {
          btnCheck.innerHTML = originalBtnText;
          btnCheck.disabled = false;
          let msg = 'ไม่สามารถอ่านพิกัดได้';
          if (err.code === 1) msg = 'ถูกปฏิเสธสิทธิ์ GPS';
          else if (err.code === 2) msg = 'ไม่พบสัญญาณ GPS';
          else if (err.code === 3) msg = 'หมดเวลาค้นหาพิกัด';
          showToast(`⚠️ ${msg}: ${err.message}`, 4000);
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
    }

    // ฟังก์ชันสำหรับคัดลอกพิกัดลงคลิปบอร์ด
    function copyCoords() {
      if (!me) {
        showToast('⚠️ ยังไม่มีพิกัดให้คัดลอก');
        return;
      }
      const coordStr = `${me.latitude.toFixed(6)}, ${me.longitude.toFixed(6)}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(coordStr).then(() => {
          showToast(`📋 คัดลอกพิกัดแล้ว: ${coordStr}`);
        }).catch(() => {
          prompt('คัดลอกพิกัดของคุณ:', coordStr);
        });
      } else {
        prompt('คัดลอกพิกัดของคุณ:', coordStr);
      }
    }

    // สลับการเปิด/ปิดแผงเครื่องมือ
    function toggleToolsPanel() {
      const isVisible = toolsPanel.style.display === 'block';
      toolsPanel.style.display = isVisible ? 'none' : 'block';
    }

    // นำพิกัดใหม่ไปตั้งค่าใน A-Frame entities และบันทึกลง localStorage
    function applyAndSavePlaces(placesData) {
      places.forEach(p => {
        const name = p.dataset.name;
        if (placesData[name]) {
          const { lat, lon } = placesData[name];
          p.setAttribute('gps-new-entity-place', `latitude: ${lat}; longitude: ${lon}`);
        }
      });
      try {
        localStorage.setItem('ar_saved_places', JSON.stringify(placesData));
      } catch (e) {}
      renderHUD();
    }

    // 🎯 สร้างเซ็ตพิกัดจุด A, B, C อัตโนมัติรอบตำแหน่งปัจจุบันของผู้ใช้ (~25-30 เมตร)
    function setPointsAroundMe() {
      if (!me) {
        showToast('⚠️ กรุณารอพิกัด GPS หรือกด "เช็คพิกัด" ก่อน');
        return;
      }
      // ออฟเซ็ตประมาณ ~27 เมตร (0.00025 องศา)
      const offset = 0.00025;
      const newPlaces = {
        'Abyme': { lat: me.latitude + offset, lon: me.longitude },          // ทิศเหนือ
        'จุด B': { lat: me.latitude, lon: me.longitude + offset },          // ทิศตะวันออก
        'จุด C': { lat: me.latitude - offset, lon: me.longitude }           // ทิศใต้
      };
      applyAndSavePlaces(newPlaces);
      showToast('🎯 เซ็ตพิกัดจุด A, B, C รอบตัวสำเร็จ (~25 ม.)', 4000);
    }

    // 📌 ปักหมุดเฉพาะจุด (A, B หรือ C) ณ ตำแหน่งที่ผู้ใช้ยืนอยู่ตอนนี้
    function pinSinglePoint(pointName) {
      if (!me) {
        showToast('⚠️ กรุณารอพิกัด GPS ก่อน');
        return;
      }
      let saved = {};
      try {
        saved = JSON.parse(localStorage.getItem('ar_saved_places')) || {};
      } catch(e) {}

      // ถ้ายังไม่มีพิกัดจุดอื่น ให้ดึงจากปัจจุบัน
      places.forEach(p => {
        const name = p.dataset.name;
        if (!saved[name]) {
          const attr = p.getAttribute('gps-new-entity-place');
          saved[name] = { lat: parseFloat(attr.latitude), lon: parseFloat(attr.longitude) };
        }
      });

      saved[pointName] = { lat: me.latitude, lon: me.longitude };
      applyAndSavePlaces(saved);
      showToast(`📌 ปักหมุด ${pointName} ที่พิกัดปัจจุบันเรียบร้อย!`, 3000);
    }

    // คัดลอกโค้ดตำแหน่งที่ปรับแล้วไปใส่ใน index.html
    function copyConfigCode() {
      let code = '';
      places.forEach(p => {
        const name = p.dataset.name;
        const attr = p.getAttribute('gps-new-entity-place');
        code += `<!-- ${name} -->\ngps-new-entity-place="latitude: ${attr.latitude}; longitude: ${attr.longitude}"\n\n`;
      });
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(() => {
          showToast('📄 คัดลอกโค้ดพิกัดแล้ว นำไปวางในไฟล์ได้เลย!', 4000);
        }).catch(() => {
          prompt('คัดลอกโค้ดพิกัดของคุณ:', code);
        });
      } else {
        prompt('คัดลอกโค้ดพิกัดของคุณ:', code);
      }
    }

    // คืนค่าพิกัดเริ่มต้นจากเทมเพลต
    function resetToDefaultPlaces() {
      try {
        localStorage.removeItem('ar_saved_places');
      } catch (e) {}
      applyAndSavePlaces(defaultPlaces);
      showToast('🔄 คืนค่าพิกัดตั้งต้นเรียบร้อย');
    }

    // โหลดพิกัดที่เคยเซ็ตไว้จาก localStorage (ถ้ามี)
    function loadSavedPlaces() {
      try {
        const saved = JSON.parse(localStorage.getItem('ar_saved_places'));
        if (saved) {
          applyAndSavePlaces(saved);
        }
      } catch (e) {}
    }

    // ตรวจสอบ In-App Browser (เช่น LINE) เพื่อบังคับเปิดในเบราว์เซอร์หลัก (Chrome/Safari) ป้องกันโดนบล็อกกล้อง
    const isLine = /Line/i.test(navigator.userAgent);
    if (isLine && !location.search.includes('openExternalBrowser=1')) {
      const sep = location.href.includes('?') ? '&' : '?';
      location.href = location.href + sep + 'openExternalBrowser=1';
    }

    // แจ้งเตือนเมื่อเปิดผ่าน HTTP นอก localhost (เบราว์เซอร์มือถือจะบล็อกกล้องและ GPS ทันทีหากไม่ใช่ HTTPS)
    if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      hudCoords.innerHTML = '<span style="color:#ff6b6b">⚠️ ต้องเปิดผ่าน HTTPS!</span>';
      hudSub.innerHTML = 'เบราว์เซอร์บล็อกกล้อง/GPS เมื่อเปิดผ่าน HTTP';
    }

    // สำหรับ iPhone (iOS): แตะหน้าจอ 1 ครั้งเพื่อขอสิทธิ์เซนเซอร์ทิศทาง (DeviceOrientation)
    window.addEventListener('click', () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().catch(() => {});
      }
    }, { once: true });

    scene.addEventListener('loaded', () => {
      loadSavedPlaces();
      if (SIM) {
        const a = places[0].getAttribute('gps-new-entity-place');
        setTimeout(() => {
          const simLat = parseFloat(a.latitude) - 0.0003;
          const simLon = parseFloat(a.longitude) + 0.000001;
          me = { latitude: simLat, longitude: simLon };
          accuracy = 5;
          lastUpdate = new Date();
          cam.setAttribute('gps-new-camera', {
            simulateLatitude: simLat, simulateLongitude: simLon
          });
          renderHUD();
        }, 500);
      }
    });

    // รับตำแหน่งจากกล้อง AR.js เมื่อกล้องขยับ
    cam.addEventListener('gps-camera-update-position', e => {
      updatePosition(e.detail.position);
    });

    // อ่านตำแหน่งและพิกัด GPS แบบ Real-time ต่อเนื่องตามการเคลื่อนที่ของมือถือ
    if (!SIM && navigator.geolocation) {
      navigator.geolocation.watchPosition(
        pos => {
          updatePosition(pos.coords);
        },
        err => {
          if (err.code === 1) {
            statusDot.style.background = '#FF6B6B';
            statusText.textContent = 'ถูกปฏิเสธสิทธิ์ GPS';
            hudCoords.innerHTML = '<span style="color:#ff8787">ไม่ได้รับอนุญาตให้ใช้ GPS</span>';
            hudSub.innerHTML = 'กรุณาเปิดสิทธิ์ Location ในเบราว์เซอร์';
          } else if (err.code === 2) {
            statusDot.style.background = '#FF6B6B';
            statusText.textContent = 'ไม่พบสัญญาณ GPS';
            hudCoords.innerHTML = '<span style="color:#ff8787">ค้นหาสัญญาณ GPS ไม่พบ</span>';
            hudSub.innerHTML = 'กรุณาเปิดตำแหน่งในมือถือและออกไปที่โล่ง';
          }
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 27000 }
      );
    }

    // อัปเดตการแสดงผล HUD ทุก 1 วินาที เพื่อรีเฟรชระยะทางแบบเรียลไทม์
    setInterval(renderHUD, 1000);
  </script>
</body>
</html>
